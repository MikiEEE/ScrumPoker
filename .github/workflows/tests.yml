name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python tests
        run: python -m unittest tests.test_scrum_poker_app tests.test_smallos_websocket_server -v

      - name: Check Python syntax
        run: python -m compileall -q app.py scrum_poker_core.py scrum_poker_app.py scrum_poker_host.py scrum_poker_shell.py smallos_websocket_server.py

      - name: Check JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/setup_room.js

      - name: Validate documentation index
        run: node docs/build-index.mjs --check
